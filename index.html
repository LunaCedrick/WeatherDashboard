<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Document metadata -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A weather-reactive dashboard with dynamic sky gradients and frosted glass cards.">
  <title>Weather Dashboard</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;900&family=Inter:wght@400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="weather-default">
  <!-- Page header -->
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">Weather Dashboard</h1>
    </div>
  </header>

  <!-- Main dashboard content -->
  <main class="app-shell" aria-labelledby="dashboard-title">
    <!-- Search controls -->
    <section class="search-panel glass-card" aria-labelledby="dashboard-title">
      <h2 id="dashboard-title" class="search-panel__title">Search Weather</h2>

      <form class="search" id="search-form">
        <label class="visually-hidden" for="search-input">Search for a city</label>
        <div class="search__field">
          <input
            class="search__input"
            id="search-input"
            name="city"
            type="search"
            placeholder="Search city"
            aria-label="Search for a city"
            aria-autocomplete="list"
            aria-controls="city-suggestions"
            aria-expanded="false"
            autocomplete="off"
          >
          <div
            class="suggestions"
            id="city-suggestions"
            role="listbox"
            aria-label="City suggestions"
            hidden
          ></div>
        </div>
        <button class="search__button" id="search-button" type="submit" aria-label="Get weather">
          Search
        </button>
      </form>

      <div class="unit-toggle" aria-label="Temperature unit">
        <button class="unit-toggle__btn unit-toggle__btn--active" id="unit-celsius" type="button" aria-pressed="true">
          C
        </button>
        <button class="unit-toggle__btn" id="unit-fahrenheit" type="button" aria-pressed="false">
          F
        </button>
      </div>
    </section>

    <!-- Current weather output -->
    <section class="weather-card glass-card" id="weather-card" aria-live="polite">
      <h2 class="weather-card__title">Current Weather</h2>
      <p class="weather-card__empty">Search for a city to see the sky change.</p>
      <div class="loading-state" id="loading-state" hidden></div>
      <p class="error-message" id="error-message" role="alert" hidden></p>
    </section>

    <!-- Forecast output -->
    <section class="forecast-section" aria-labelledby="forecast-title">
      <h2 class="forecast-section__title" id="forecast-title">5-Day Forecast</h2>
      <div class="forecast-container" id="forecast-container" aria-live="polite"></div>
    </section>
  </main>

  <!-- Page footer -->
  <footer class="app-footer">
    <p class="app-footer__text">Powered by OpenWeatherMap</p>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
